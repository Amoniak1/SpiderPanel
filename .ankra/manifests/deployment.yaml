apiVersion: v1
kind: ServiceAccount
metadata:
  name: spiderpanel
  labels:
    app.kubernetes.io/name: spiderpanel
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spiderpanel
  labels:
    app.kubernetes.io/name: spiderpanel
  annotations:
    ankra.io/generated: "true"
spec:
  replicas: 1
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: spiderpanel
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spiderpanel
    spec:
      serviceAccountName: spiderpanel
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ankra-registry-pull
      containers:
        - name: spiderpanel
          image: registry.ankra.cloud/org-380610e9-c695-4d7a-811e-c9041e527957/spiderpanel:${{ ankra.image_tag }}
          imagePullPolicy: IfNotPresent
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MTPROXY_BIN
              valueFrom:
                secretKeyRef:
                  name: spiderpanel-env
                  key: MTPROXY_BIN
                  optional: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: uploads
              mountPath: /app/static/uploads
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: uploads
          emptyDir: {}
