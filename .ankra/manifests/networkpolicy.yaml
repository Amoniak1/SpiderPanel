apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: spiderpanel
  labels:
    app.kubernetes.io/name: spiderpanel
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spiderpanel
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
    - ports:
        - port: 8080
          protocol: TCP
